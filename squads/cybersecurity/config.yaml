  tabletop-exercise-facilitation:
    agents: [marcus-carey, cyber-chief]
    frameworks: [ir-layer]
    checklists: [tabletop-exercise-quality, carey/carey-communication-under-pressure]
    templates: [reports/postmortem-template]
    registry: [data/registries/lessons-learned-registry]

  # ---- INCIDENT RESPONSE ----
  triage-and-severity:
    agents: [chris-sanders, omar-santos, cyber-chief]
    frameworks: [nist-800-61-incident-response, ir-layer]
    checklists: [incident-triage-quality, incident-response/ir-triage-and-severity]
    templates: [briefs/incident-intake-template]
    registry: [data/registries/incident-registry]

  containment-actions:

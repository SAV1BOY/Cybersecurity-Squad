  postmortem-and-actions:
    agents: [marcus-carey, cyber-chief]
    frameworks: [ir-layer]
    checklists: [carey/carey-lessons-learned, carey/carey-communication-under-pressure]
    templates: [reports/postmortem-template]
    registry: [data/registries/incident-registry, data/registries/lessons-learned-registry]

  incident-communication:
    agents: [marcus-carey, cyber-chief]
    frameworks: [ir-layer, governance-layer]
    checklists: [incident-response/ir-communication-escalation, carey/carey-communication-under-pressure]
    templates: [communications/incident-notification-template, communications/incident-external-comms-template]
    registry: [data/registries/incident-registry]

  # ---- REVIEW ----
  findings-review:
    agents: [cyber-chief, peter-kim, jim-manico]
    frameworks: [finding-structure-standard, risk-scoring-model]
    checklists: [security-report-quality, evidence-chain-quality]

# ============================================================
# CYBERSECURITY SQUAD — config.yaml (Cerebro de Roteamento)
# ============================================================

squad:
  name: cybersecurity
  version: "1.0.0"
  description: "Red Team + Blue Team + AppSec + CloudSec + IR Squad do MMOS"
  chief_agent: cyber-chief

principles:
  - authorized-only          # Nada sem autorizacao explicita
  - evidence-first           # Tudo com prova e rastreabilidade
  - minimize-impact          # Minimo dano, minima alteracao
  - reproducible-results     # Resultados reproduziveis e verificaveis
  - fix-over-fear            # Foco em consertar, nao em assustar

# ============================================================
# AGENTS
# ============================================================

agents:
  core:
    - peter-kim              # Red Team pragmatico
    - georgia-weidman        # Pentest hands-on
    - jim-manico             # AppSec/OWASP
    - chris-sanders          # NSM/DFIR
    - omar-santos            # Blue Team/CyberOps
    - marcus-carey           # Cultura e operacao

  special:
    - cyber-chief            # Orquestrador
    - command-generator      # Gerador de comandos seguros
    - cartographer           # Mapeador de superficie
    - busterer               # Descoberta/enumeracao
    - dirber                 # Enumeracao web
    - fuzzer                 # Fuzzing
    - ripper                 # Auditoria de credenciais
    - rogue                  # Adversary simulado
    - shannon-runner         # Entropy/anomaly runner

# ============================================================
# ROUTING: Para cada TASK, quais AGENTS, FRAMEWORKS,
# CHECKLISTS, TEMPLATES e REGISTRIES sao obrigatorios
# ============================================================

routing:

  # ---- INTAKE ----
  collect-authorization-and-roe:
    agents: [cyber-chief]
    frameworks: [ptes-penetration-testing]
    checklists: [scope-and-roe-quality]
    templates: [briefs/pentest-roe-template, briefs/security-assessment-brief]
    registry: [data/registries/decisions-log]

  define-success-criteria:
    agents: [cyber-chief]
    frameworks: [governance-layer]
    checklists: [scope-and-roe-quality]
    templates: [briefs/security-assessment-brief]
    registry: [data/registries/decisions-log]

  setup-comms-and-escalation:
    agents: [cyber-chief, marcus-carey]
    frameworks: [governance-layer]
    checklists: [carey/carey-communication-under-pressure]
    templates: [communications/incident-notification-template]
    registry: [data/registries/decisions-log]

  asset-scoping:
    agents: [cyber-chief, cartographer]
    frameworks: [discovery-layer]
    checklists: [asset-inventory-quality]
    templates: [trackers/asset-inventory-tracker]
    registry: [data/registries/asset-registry]

  risk-context-gathering:
    agents: [cyber-chief]
    frameworks: [fair-risk-quantification, governance-layer]
    checklists: [scope-and-roe-quality]
    templates: [briefs/security-assessment-brief]
    registry: [data/registries/risk-register]

  # ---- DISCOVERY ----
  asset-discovery:
    agents: [cartographer, cyber-chief]
    frameworks: [discovery-layer]
    checklists: [asset-inventory-quality]
    templates: [trackers/asset-inventory-tracker]
    registry: [data/registries/asset-registry]

  attack-surface-mapping:
    agents: [cartographer, busterer, dirber, peter-kim]
    frameworks: [discovery-layer, mitre-att-ck]
    checklists: [attack-surface-mapping-quality, kim/kim-recon-checklist]
    templates: [reports/technical-report-template]
    registry: [data/registries/findings-registry]

  threat-modeling:
    agents: [jim-manico, cyber-chief]
    frameworks: [stride-threat-model, pasta-threat-model, appsec-layer]
    checklists: [threat-model-quality, manico/manico-owasp-top10-mapping]
    templates: [briefs/threat-model-brief, reports/threat-model-report-template]
    registry: [data/registries/risk-register]

  logging-and-visibility-gap-audit:
    agents: [chris-sanders, omar-santos]
    frameworks: [defense-layer, detection-coverage-matrix]
    checklists: [blue-team/blueteam-logging-coverage, santos/santos-visibility-matrix]
    templates: [trackers/detection-coverage-tracker]
    registry: [data/registries/detection-rules-registry]

  identity-and-privilege-mapping:
    agents: [cartographer, omar-santos]
    frameworks: [identity-layer, zero-trust-architecture]
    checklists: [identity-and-ad-assessment-quality, cloud/cloud-iam-least-privilege]
    templates: [reports/technical-report-template]
    registry: [data/registries/asset-registry]

  data-flow-mapping:
    agents: [cartographer, jim-manico]
    frameworks: [discovery-layer, appsec-layer]
    checklists: [threat-model-quality]
    templates: [reports/threat-model-report-template]
    registry: [data/registries/asset-registry]

  # ---- RED TEAM ----
  recon-and-enumeration:
    agents: [peter-kim, busterer, dirber, cartographer]
    frameworks: [offense-layer, ptes-penetration-testing]
    checklists: [kim/kim-recon-checklist, red-team/redteam-safe-testing-rules]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  vuln-validation:
    agents: [georgia-weidman, peter-kim, fuzzer]
    frameworks: [offense-layer, risk-scoring-model]
    checklists: [vuln-assessment-quality, weidman/weidman-exploitation-validation, evidence-chain-quality]
    templates: [reports/finding-template, reports/technical-report-template]
    registry: [data/registries/findings-registry]

  safe-exploitation-simulation:
    agents: [rogue, georgia-weidman, peter-kim]
    frameworks: [offense-layer, lockheed-martin-kill-chain]
    checklists: [pentest-execution-quality, weidman/weidman-post-exploit-safety, red-team/redteam-safe-testing-rules]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  lateral-movement-hypothesis:
    agents: [rogue, peter-kim]
    frameworks: [lateral-movement-methodology, mitre-att-ck]
    checklists: [red-team/redteam-attack-chain-review, kim/kim-network-pivoting-audit]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  privilege-escalation-testing:
    agents: [georgia-weidman, rogue]
    frameworks: [privilege-escalation-methodology]
    checklists: [weidman/weidman-privilege-escalation-audit, red-team/redteam-safe-testing-rules]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  credential-attack-testing:
    agents: [ripper, peter-kim]
    frameworks: [credential-attack-methodology]
    checklists: [kim/kim-attack-path-prioritization, red-team/redteam-safe-testing-rules]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  social-engineering-campaign:
    agents: [rogue, marcus-carey]
    frameworks: [phishing-simulation-methodology]
    checklists: [social-engineering-assessment-quality, carey/carey-ethical-boundaries]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  report-findings:
    agents: [peter-kim, cyber-chief]
    frameworks: [finding-structure-standard, risk-scoring-model]
    checklists: [security-report-quality, kim/kim-proof-and-reporting, evidence-chain-quality]
    templates: [reports/technical-report-template, reports/executive-summary-template]
    registry: [data/registries/findings-registry]

  # ---- APPSEC ----
  secure-code-review:
    agents: [jim-manico, command-generator]
    frameworks: [owasp-asvs, appsec-layer, nist-ssdf]
    checklists: [code-review-security-quality, manico/manico-secure-coding-review, manico/manico-authn-authz-audit]
    templates: [reports/finding-template, reports/technical-report-template]
    registry: [data/registries/findings-registry]

  api-security-review:
    agents: [jim-manico, fuzzer]
    frameworks: [owasp-api-top-10, api-security-testing-methodology]
    checklists: [api-security-assessment-quality, appsec/appsec-api-security-gate]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  sdlc-security-gates-setup:
    agents: [jim-manico, cyber-chief]
    frameworks: [owasp-samm, nist-ssdf, appsec-layer]
    checklists: [manico/manico-ssdlc-gates]
    templates: [policies/secure-sdlc-policy]
    registry: [data/registries/decisions-log]

  secrets-management-hardening:
    agents: [jim-manico, omar-santos]
    frameworks: [appsec-layer]
    checklists: [appsec/appsec-secrets-management]
    templates: [reports/remediation-plan-template]
    registry: [data/registries/remediation-registry]

  dependency-security-audit:
    agents: [jim-manico, command-generator]
    frameworks: [supply-chain-attack-defense]
    checklists: [appsec/appsec-supply-chain, supply-chain-security-quality]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  security-champion-onboarding:
    agents: [jim-manico, marcus-carey]
    frameworks: [security-champion-program]
    checklists: [carey/carey-security-culture-audit]
    templates: [reports/security-posture-report-template]
    registry: [data/registries/decisions-log]

  threat-model-workshop:
    agents: [jim-manico, cyber-chief]
    frameworks: [stride-threat-model, pasta-threat-model]
    checklists: [threat-model-quality]
    templates: [briefs/threat-model-brief, reports/threat-model-report-template]
    registry: [data/registries/risk-register]

  # ---- CLOUDSEC ----
  iam-least-privilege-project:
    agents: [omar-santos, cyber-chief]
    frameworks: [cloudsec-layer, zero-trust-architecture]
    checklists: [cloud/cloud-iam-least-privilege, cloud-security-assessment-quality]
    templates: [reports/finding-template, reports/remediation-plan-template]
    registry: [data/registries/findings-registry, data/registries/remediation-registry]

  storage-exposure-audit:
    agents: [omar-santos, cartographer]
    frameworks: [cloudsec-layer]
    checklists: [cloud/cloud-storage-exposure]

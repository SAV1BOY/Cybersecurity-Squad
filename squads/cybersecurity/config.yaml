  cross-squad-sync:
    agents: [cyber-chief, marcus-carey]
    frameworks: [governance-layer]
    checklists: []
    templates: []
    registry: [data/registries/decisions-log]

  create-new-agent:
    agents: [cyber-chief]
    frameworks: []
    checklists: []
    templates: []
    registry: [data/registries/decisions-log]

  swipe-file-curation:
    agents: [cyber-chief]
    frameworks: []
    checklists: []
    templates: []
    registry: []

  update-threat-intelligence:
    agents: [rogue, shannon-runner]
    frameworks: [mitre-att-ck]
    checklists: []

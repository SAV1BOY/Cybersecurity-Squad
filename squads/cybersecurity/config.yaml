    checklists: [cloud/cloud-logging-and-trails, santos/santos-soc-readiness]
    templates: [policies/logging-retention-policy-template]
    registry: [data/registries/decisions-log]

  network-segmentation-review:
    agents: [omar-santos, cartographer]
    frameworks: [cloudsec-layer, zero-trust-architecture]
    checklists: [cloud/cloud-network-segmentation]
    templates: [reports/finding-template]
    registry: [data/registries/findings-registry]

  cloud-guardrails-setup:
    agents: [omar-santos, cyber-chief]
    frameworks: [cloudsec-layer, governance-layer]
    checklists: [cloud/cloud-multi-account-security]
